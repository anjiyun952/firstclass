<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Font/CSS/BKBulPro-Bold.css">
    <link rel="stylesheet" href="../Font/CSS/SDG.css">
    <link rel="stylesheet" href="../Font/CSS/pretendardvariable.css">
    <link rel="stylesheet" href="../CSS/default.css">
    <title>버거킹 로그인 화면</title>
    <style>
        :root {
            --font-SDG: "SDG", sans-serif;
            --font-Pretendard: "Pretendard Variable", sans-serif;
            --font-BKR: 'BKR', sans-serif;
            --primary-color: #512314;
            --Focus-color: #D62302;
            --baseborder-color: #D9CFC6;
            --inputbg-color: #FFFCF9;
            --error-primary-color: #C54734;
            --button-color: #E9DDCD;
            --placeholder-color: #EBE6E2;
            --text-color: #766053;
            --bg-color: #F4EBDC;

        }
        body {
            font-family: var(--font-SDG);
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--primary-color);
        }
        a {
            color: inherit;
        }
        main {
            background-color: none;
            padding: 48px 20px 90px;
        }
        .title {
            font-family: var(--font-BKR);
            display: flex;
            gap: 16px;
            margin-bottom: 50px;
            flex-direction: column;
            font-size: 3.5rem;
            color: var(--primary-color);
        }
        .title >span:first-child {
            font-size: 2.5rem;
            line-height: 1;
        }
        
        .title >span:last-child {
            font-size: 3.5rem;
            line-height: 1;
        }

        input {
            border: 1px solid var(--baseborder-color);
            background-color: var(--inputbg-color);
        }
        
        input::placeholder {
            color: var(--placeholder-color);
        }

        html {
            font-size: 62.5%;    
        }
        #wrap {
            max-width: 1024px;
            min-width: 360px;
            min-height: 100dvb;
            background-color: var(--bg-color);
            width: 100%;
            margin: 0 auto;
        }
        header {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 자식요소에 absolute가 적용되어 위치값이 들어가는 순간 flex속성으로 적용불가*/
            height: 48px;
        }
        .prev_btn {
            width: 48px;
            left: 0;
            height: 48px;
            position: absolute;
            background: url(Images/back_icon.svg) no-repeat scroll center / auto;
        }
        h1 {
            font-size: 2.0rem;
        }
        .email {
            font-size: 1.5rem;
            line-height: 1;
        }
        input[type="email"] {
            margin-top: 8px;
        }
        input[type="password"] {
            margin-top: 10px;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            max-width: 1024px; 
            min-width: 350px;
            height: 44px;
            padding: 20px;
            border-radius: 10px;
        }
        .input_box.rela {
            position: relative;
        }
        .pw_btn {
            position: absolute;
            right: 20px;
            width: 20px;
            height: 20px;
            background : url(Images/eye_icon.svg)
            no-repeat center / 26px;
            bottom: 10px;
        }

        .login-btn {
            width: 100%;
            max-width: 1024px; 
            min-width: 350px;
            height: 44px;
            border-radius: 22px;
            font-family: inherit;
            font-size: inherit;
            color: var(--placeholder-color);
            background-color: var(--primary-color);
            border: none;
            opacity: 0.2;
        }
        a {
            text-decoration: none;
        }
        .login_link,.sns_login,.sns_list {
            font-family: var(--font-Pretendard);
            font-size: 500;
        }
        .login_link {
            margin-top: 20px;
            font-family: var(--font-Pretendard);
            font-weight: 500;
            font-size: 1.4rem;
            text-align: center;
        }
        .login_link a {
            display: inline-flex;
            align-items: center;
            column-gap: 4px;
        }
        .login_link a::after{
            content: "";
            display: inline-block;
            width: 1px;
            height: 12px;
            background-color: var(--primary-color);
            opacity: 0.5;
        }
        .login_link a:last-child::after {
            content: "";
            display: none;
        }
        .sns_login {
            margin-top: 96px;
        }
        .sns_login >p {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            column-gap: 12px;
            font-size: 1.3rem;
            color: var(--text-color);
            /*줄바꿈을 하지 않겠다. */
            white-space: nowrap;
        }
        .sns_login >p::before, .sns_login >p::after {
            content: "";
            display: inline-block;
            width: 100%;
            height: 1px;
            background-color: var(--primary-color);
            opacity: 0.3;
            
        }
        .sns_list {
            justify-content :center;
            display: flex;
            column-gap: 20px;
        }
        .sns_list >a {
            display: inline-block;
            width: 45px;
            height: 45px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 45px;
            

        }
        .sns_list > a:first-child {
            background-image: url(Images/kakao_logo_icon.svg);
        }
        .sns_list > a:nth-child(2) {
            background-image: url(Images/naver_logo_icon.svg);
        }
        .sns_list > a:nth-child(3) {
            background-image: url(Images/apple_logo_icon.svg);
        }
        .sns_list > a:nth-child(4) {
            background-image: url(Images/samsung_logo_icon.svg);
        }
        .pw_btn {
            width: 26px;
            height: 26px;
            background: url(Images/eye_icon.svg) no-repeat center / 26px 26px;
        }
        .login-option {
            margin-top: 12px;
        }
        .login-option label {
            /* label요소가 span요소를 정확히 감싸기 위해 적용
            */
            display: inline-flex;
        }
        .login-option label:first-child {
            margin-right: 30px;
        }
        .login-option span {
            /* 각각의 span을 좌우 정렬하기 위해 
            inline-flex사용 
            */
            display: inline-flex;
            align-items: center;
            column-gap: 6px;
        }
        .login-option .check + span::before {
            content: "";
            display: inline-block;
            width: 30px;
            height: 30px;
            background: url(Images/state=Chackbox_Disabled.svg)
            no-repeat center / contain;
        }
        .login-option .check:checked + span::before {
            content: "";
            background-image: url(Images/state=Chackbox_Active.svg);
        }

    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>로그인</h1> 
            <button class="prev_btn">
                <span class="sr-only">이전버튼</span></button> 
        </header>
        <main>
            <h2 class="title"> 
                <span>안녕하세요:)</span>
                <span>버거킹입니다.</span>
            </h2>
            <form action="">
                <!-- 이메일 로그인 -->
                <fieldset>
                    <!-- 아이디 -->
                    <label for="email" class="email">이메일 로그인</label>
                    <div class="input_box rela">
                        <input type="email" id="email" name="email" placeholder="아이디(이메일)을 입력해 주세요">
                    </div>
                    <!-- 비밀번호 -->
                     <div class="input_box rela">
                     <input type="password" name="password"
                        placeholder="비밀번호를 입력해 주세요.">
                     <button type="button" class="pw_btn">
                        <span class="sr-only">비밀번호 보기</span>
                     </button>                   
                     </div>
                    <div class="login-option">
                     <label>
                        <input type="checkbox" class="check sr-only" checked>
                        <span>자동 로그인</span>
                     </label>
                     <label>
                        <input type="checkbox" class="check sr-only">
                        <span>아이디 저장</span>
                     </label>
                    </div>
                    <button type="submit" class="login-btn"><span>로그인</span></button>
                </fieldset>
            </form>
            <div class="login_link">
                <a href="#">아이디 찾기</a>
                <a href="#">비밀번호 재설정</a>
                <a href="#">회원가입</a>
            </div>
            <div class="sns_login">
                <p>SNS으로 간편하게 로그인</p>
                <div class="sns_list">
                <a href="#"><span class="sr-only">카카오 로그인</span></a>
                <a href="#"><span class="sr-only">네이버 로그인</span></a>
                <a href="#"><span class="sr-only">애플 로그인</span></a>
                <a href="#"><span class="sr-only">삼성카드로그인</span></a>
            </div>
        </main>
  </div>
</body>
</html>
