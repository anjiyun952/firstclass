<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도미노피자 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="preload" href="../Font/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../Font/TT_Commons_Pro_Mono_Trial_Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../Font/CSS/TT_Commons_Pro_Mono_Trial_Bold.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-inner">
                <a class="header-logo" href="index.html" aria-label="도미노피자 홈">
                    <img src="images/flex-logo.png" alt="도미노피자">
                </a>
                <nav class="header-nav" aria-label="주 메뉴">
                    <a href="#menu">MENU</a>
                    <a href="#event">EVENT</a>
                    <a href="#brand">BRAND</a>
                    <a href="#store">STORE</a>
                    <a href="#coupon">COUPON</a>
                    <a class="franchise-link" href="#franchise">가맹점</a>
                </nav>
                <div class="header-user">
                    <a href="#customer-service">고객센터</a>
                    <a href="#login">로그인</a>
                </div>
            </div>
        </header>
        <main>
            <section class="hero-sec" aria-label="도미노피자 주요 프로모션">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <picture>
                                <source media="(max-width: 1024px)" srcset="images/m_visual1-2.png">
                                <img src="images/visual1.png" alt="단체 주문 할인 배너">
                            </picture>
                        </div>
                        <div class="swiper-slide">
                            <picture>
                                <source media="(max-width: 1024px)" srcset="images/m_visual2-2.png">
                                <img src="images/visual2.png" alt="콜라보 이벤트 배너">
                            </picture>
                        </div>
                    </div>
                    <div class="swiper-button-prev" aria-label="이전 슬라이드">
                        <img src="images/left_arrow.svg" alt="">
                    </div>
                    <div class="swiper-button-next" aria-label="다음 슬라이드">
                        <img src="images/right_arrow.svg" alt="">
                    </div>
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiper = new Swiper('.hero-sec .swiper', {
            direction: 'horizontal',
            loop: true,
            navigation: {
                nextEl: '.hero-sec .swiper-button-next',
                prevEl: '.hero-sec .swiper-button-prev',
            },
            autoplay: {
                delay: 3000,
            },
        });
    </script>
</body>
</html>
