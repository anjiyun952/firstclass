<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Font/CSS/SoDoSans.css">
    <link rel="stylesheet" href="../Font/CSS/pretendardvariable.css">
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="AppSettings.css">
    <title>스타벅스 앱 환경설정</title>
</head>
<body>
    <div id="wrap">
        <header>
            <button type="button" class="prev_btn">
                <span class="sr-only">이전 버튼</span>
            </button>
            <h1>앱 환경설정</h1>
        </header>

        <main>
            <section class="setting-group" aria-labelledby="login-setting-title">
                <h2 id="login-setting-title">로그인</h2>

                <div class="setting-list">
                    <label class="setting-item">
                        <span>자동 로그인</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <a href="#" class="setting-item setting-link">
                        <span>SNS 간편 로그인</span>
                        <span class="arrow" aria-hidden="true"></span>
                    </a>
                </div>
            </section>

            <section class="setting-group" aria-labelledby="function-setting-title">
                <h2 id="function-setting-title">편리기능</h2>

                <div class="setting-list">
                    <label class="setting-item">
                        <span>흔들어서 멤버십 바코드 열기</span>
                        <input type="checkbox" class="setting-toggle sr-only">
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item">
                        <span>앱 실행 시 멤버십 바코드 바로 열기</span>
                        <input type="checkbox" class="setting-toggle sr-only">
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item">
                        <span>잠금 화면 주문 현황 표시</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>
                </div>
            </section>

            <section class="setting-group" aria-labelledby="push-setting-title">
                <h2 id="push-setting-title">앱 푸시 설정</h2>

                <div class="setting-list">
                    <label class="setting-item">
                        <span>주문 정보 알림 수신 동의</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item">
                        <span>마케팅 정보(이벤트,혜택) 수신 동의</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item sub-item">
                        <span>앱 푸시 수신</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item sub-item">
                        <span>SNS 수신</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item sub-item night-setting">
                        <span>
                            야간 알림 허용
                            <small>야간 (오후 9시 ~ 익일 오전 8시에도 알림을 수신합니다.)</small>
                        </span>
                        <input type="checkbox" class="setting-toggle sr-only">
                        <span class="toggle" aria-hidden="true"></span>
                    </label>
                </div>
            </section>

            <section class="setting-group" aria-labelledby="service-setting-title">
                <h2 id="service-setting-title">서비스 동의</h2>

                <div class="setting-list">
                    <label class="setting-item">
                        <span>선호정보 수집/활용 동의</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>
                </div>
            </section>

            <section class="account-info" aria-label="앱 정보 및 로그아웃">
                <p class="version">현재 버전 v5.0.21_206.0</p>
                <a href="#" class="logout">로그아웃</a>
            </section>
        </main>
    </div>
</body>
</html>
