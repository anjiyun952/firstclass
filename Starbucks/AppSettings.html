<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Font/CSS/SoDoSans.css">
    <link rel="stylesheet" href="../Font/CSS/pretendardvariable.css">
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="AppSettings.css">
    <link id="active-theme-css" rel="stylesheet" href="collage.css">
    <link rel="stylesheet" href="theme-switcher.css">
    <title>스타벅스 앱 환경설정</title>
</head>
<body class="collage-style">
    <div id="wrap">
    <div class="theme-switcher">
        <label for="design-theme">디자인 스타일 비교</label>
        <select id="design-theme" aria-label="디자인 테마 선택">
            <option value="original">Original · 기존 디자인</option>
            <option value="minimalism">01 · Minimalism</option>
            <option value="editorial">02 · Editorial</option>
            <option value="swiss">03 · Swiss Style</option>
            <option value="bento">04 · Bento Grid</option>
            <option value="glass">05 · Glassmorphism</option>
            <option value="clay">06 · Claymorphism</option>
            <option value="neo">07 · Neo Brutalism</option>
            <option value="maximalism">08 · Maximalism</option>
            <option value="kinetic">09 · Kinetic Typography</option>
            <option value="grainy">10 · Grainy Gradient</option>
            <option value="y2k">11 · Y2K Chrome</option>
            <option value="pixel">12 · Pixel Art</option>
            <option value="memphis">13 · Memphis</option>
            <option value="bauhaus">14 · Bauhaus</option>
            <option value="popart">15 · Pop Art</option>
            <option value="collage" selected>16 · Collage</option>
            <option value="risograph">17 · Risograph</option>
            <option value="artdeco">18 · Art Deco</option>
            <option value="cyberpunk">19 · Cyberpunk</option>
            <option value="isometric">20 · Isometric</option>
        </select>
    </div>
        <header>
            <button type="button" class="prev_btn">
                <span class="sr-only">이전 버튼</span>
            </button>
            <h1>앱 환경설정</h1>
        </header>

        <main>
            <section class="setting-group" aria-labelledby="login-setting-title">
                <h2 id="login-setting-title">로그인</h2>

                <div class="setting-list">
                    <label class="setting-item">
                        <span>자동 로그인</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <a href="#" class="setting-item setting-link">
                        <span>SNS 간편 로그인</span>
                        <span class="arrow" aria-hidden="true"></span>
                    </a>
                </div>
            </section>

            <section class="setting-group" aria-labelledby="function-setting-title">
                <h2 id="function-setting-title">편리기능</h2>

                <div class="setting-list">
                    <label class="setting-item">
                        <span>흔들어서 멤버십 바코드 열기</span>
                        <input type="checkbox" class="setting-toggle sr-only">
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item">
                        <span>앱 실행 시 멤버십 바코드 바로 열기</span>
                        <input type="checkbox" class="setting-toggle sr-only">
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item">
                        <span>잠금 화면 주문 현황 표시</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>
                </div>
            </section>

            <section class="setting-group" aria-labelledby="push-setting-title">
                <h2 id="push-setting-title">앱 푸시 설정</h2>

                <div class="setting-list">
                    <label class="setting-item">
                        <span>주문 정보 알림 수신 동의</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item">
                        <span>마케팅 정보(이벤트,혜택) 수신 동의</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item sub-item">
                        <span>앱 푸시 수신</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item sub-item">
                        <span>SNS 수신</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>

                    <label class="setting-item sub-item night-setting">
                        <span>
                            야간 알림 허용
                            <small>야간 (오후 9시 ~ 익일 오전 8시에도 알림을 수신합니다.)</small>
                        </span>
                        <input type="checkbox" class="setting-toggle sr-only">
                        <span class="toggle" aria-hidden="true"></span>
                    </label>
                </div>
            </section>

            <section class="setting-group" aria-labelledby="service-setting-title">
                <h2 id="service-setting-title">서비스 동의</h2>

                <div class="setting-list">
                    <label class="setting-item">
                        <span>선호정보 수집/활용 동의</span>
                        <input type="checkbox" class="setting-toggle sr-only" checked>
                        <span class="toggle" aria-hidden="true"></span>
                    </label>
                </div>
            </section>

            <section class="account-info" aria-label="앱 정보 및 로그아웃">
                <p class="version">현재 버전 v5.0.21_206.0</p>
                <a href="#" class="logout">로그아웃</a>
            </section>
        </main>
    </div>
    <script src="theme-switcher.js"></script>
</body>
</html>
